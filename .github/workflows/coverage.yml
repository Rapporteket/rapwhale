on:
  push:
    branches: [ "main" ]
    paths: ["R/**", "tests/**"]
  pull_request:
    branches: [ "main" ]
    paths: ["R/**", "tests/**"]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

name: test-coverage

# Ny push til ein PR avbryt den førre køyringa. Andre køyringar (main o.l.) får gå uforstyrra.
# Fast gruppenamn i staden for github.workflow: når workflowen vert kalla frå
# eit anna repo, er github.workflow namnet på den kallande workflowen.
concurrency:
  group: rapwhale-test-coverage-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # Lat pak installera fleire pakkar samtidig (setup-r set Ncpus til 1 som standard)
          Ncpus: 4

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::roxygen2, any::xml2
          needs: coverage, roxygen2

      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        with:
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
