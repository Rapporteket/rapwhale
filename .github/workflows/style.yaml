# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  pull_request:
    branches: [main]
    paths: ["**.[rR]", "**.[qrR]md", "**.[rR]markdown", "**.[rR]nw", "**.[rR]profile"]
  workflow_call:

name: Sjekk kodestil

permissions:
  contents: read

# Ny push til ein PR avbryt den førre køyringa. Fast gruppenamn i staden for
# github.workflow, som er namnet på den kallande workflowen når denne vert brukt frå eit anna repo.
concurrency:
  group: rapwhale-kodestil-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # I rapwhale sjølv vert pakken dokumentert og installert frå PR-en lenger nede,
      # og då trengst Imports-avhengnadene og roxygen2.
      # Andre repo treng berre styler og rapwhale (for rapwhale_style()).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ github.repository == 'Rapporteket/rapwhale' && 'deps::., any::sessioninfo' || 'any::sessioninfo' }}
          extra-packages: |
            any::styler
            ${{ github.repository == 'Rapporteket/rapwhale' && 'any::roxygen2' || 'github::Rapporteket/rapwhale' }}
          needs: styler
          dependencies: '"hard"'

      - name: Document
        if: github.repository == 'Rapporteket/rapwhale'
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Install package
        if: github.repository == 'Rapporteket/rapwhale'
        run: R CMD INSTALL .

      - name: Enable styler cache
        run: styler::cache_activate()
        shell: Rscript {0}

      - name: Determine cache location
        id: styler-location
        run: |
          cat(
            "location=",
            styler::cache_info(format = "tabular")$location,
            "\n",
            file = Sys.getenv("GITHUB_OUTPUT"),
            append = TRUE,
            sep = ""
          )
        shell: Rscript {0}

      - name: Cache styler
        uses: actions/cache@v6
        with:
          path: ${{ steps.styler-location.outputs.location }}
          key: ${{ runner.os }}-styler-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-styler-
            ${{ runner.os }}-

      - name: Style
        run: styler::style_pkg(style = rapwhale::rapwhale_style, exclude_dirs = "tests/testthat/rapwhale-style")
        shell: Rscript {0}

      - name: Filer som ikkje følgjer kodestilen vår
        run: git diff --ws-error-highlight=all --exit-code --patch-with-stat --color=always
