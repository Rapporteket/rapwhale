# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Kvar måndag natt, for å fanga opp endringar i R-devel og i avhengnader
    - cron: "23 2 * * 1"
  workflow_dispatch:
  workflow_call:

name: R-CMD-check

permissions:
  contents: read

# Ny push til ein PR avbryt den førre køyringa. Andre køyringar (main o.l.) får gå uforstyrra.
# Fast gruppenamn i staden for github.workflow: når workflowen vert kalla frå
# eit anna repo, er github.workflow namnet på den kallande workflowen.
concurrency:
  group: rapwhale-R-CMD-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # PR-ar: berre ubuntu-latest (release), for rask tilbakemelding.
        # main, vekeleg køyring og manuell køyring: alle plattformene.
        config: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
          {"os": "ubuntu-latest",  "r": "release"}
          ]' || '[
          {"os": "macos-latest",   "r": "release"},
          {"os": "windows-latest", "r": "release"},
          {"os": "ubuntu-latest",  "r": "devel", "http-user-agent": "release"},
          {"os": "ubuntu-latest",  "r": "release"},
          {"os": "ubuntu-latest",  "r": "oldrel-1"}
          ]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # Lat pak installera fleire pakkar samtidig (setup-r set Ncpus til 1 som standard)
          Ncpus: 4

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check, roxygen2

      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: '"--no-manual"'
          upload-snapshots: true
